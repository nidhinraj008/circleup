<div class="toast-container d-flex flex-column gap-2">
    @for(toast of commonData.toasts(); track toast.id) {
    <div class="toast d-flex align-items-center gap-2" [ngClass]="toast.type">
        <span class="icon">
            {{ toast.type === 'success' ? '✔' :
            toast.type === 'error' ? '✖' :
            toast.type === 'warning' ? '⚠' : 'ℹ' }}
        </span>
        <span class="message">{{ toast.message }}</span>
        <span class="close" (click)="commonData.remove(toast.id)">✕</span>
    </div>
    }
</div>
