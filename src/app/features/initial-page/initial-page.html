<div class="d-flex" style="height: 100vh;">
    <div class="w-100 p-3">
        <form [formGroup]="initialForm" (ngSubmit)="onClickSubmit()" class="d-flex flex-column h-100">
            <div class="d-flex flex-column pt-3 pb-4">
                <h2 class="m-0 fw-bold">Let's get started</h2>
                <div class="m-0 fw-light" style="font-size: 14px;">Tell us a little about yourself</div>
            </div>
            <div class="d-flex flex-column gap-2">
                <div class="basic-control-container form-floating">
                    <input formControlName="name" type="text" class="form-control" placeholder="Name"
                        [class.is-invalid]="initialFormControlls['name'].touched && initialFormControlls['name'].invalid">
                    <label class="primary-label">
                        Name
                    </label>
                </div>

                <div class="basic-control-container form-floating">
                    <ng-select class="form-select form-ng-select" formControlName="gender" [items]="genderOptions" bindLabel="label" bindValue="value"
                        [class.is-invalid]="initialFormControlls['gender'].touched && initialFormControlls['gender'].invalid">
                    </ng-select>
                    <label class="primary-label" for="gender">
                        Gender
                    </label>
                </div>

                <div class="basic-control-container form-floating">
                    <input formControlName="dateOfBirth" type="date" class="form-control"
                        [max]="currentDate | date:'yyyy-MM-dd'" placeholder="Date of birth"
                        [class.is-invalid]="initialFormControlls['dateOfBirth'].touched && initialFormControlls['dateOfBirth'].invalid">
                    <label class="primary-label">Date of Birth</label>
                </div>
            </div>

            <div class="mt-auto">
                <button class="primary-button" type="submit">
                    Continue
                </button>
            </div>
        </form>
    </div>
</div>
