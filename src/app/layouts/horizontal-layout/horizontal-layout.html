<div class="app-shell">
    <header class="app-header d-flex align-items-center px-3 position-sticky top-0 z-3">
        <div class="row g-0 w-100">
            <div (click)="backClick()" class="col-2">
                <i class="bi bi-chevron-left"></i>
            </div>
            <div class="col">
                <a routerLink="/" class="text-decoration-none text-dark text-center">
                    <h6 class="mb-0 fw-bold">{{pageTitle()}}</h6>
                </a>
            </div>
            <div class="col-2">
                @if(commonData.configurations().isShowGearIcon) {
                <div [routerLink]="['/settings']" class="d-flex align-items-center justify-content-end">
                    <i class="bi bi-gear-wide item-icon"></i>
                </div>
                } @else if(commonData.configurations().isShowSave) {
                <div (click)="commonData.onSaveClick()" class="d-flex align-items-center justify-content-end">
                    <i class="bi bi-floppy"></i>
                </div>
                }
            </div>
        </div>
    </header>

    <main class="app-content d-flex flex-column neo-shadow-curvedin">
        <app-pull-to-refresh class="flex-fill">
            <router-outlet></router-outlet>
        </app-pull-to-refresh>
    </main>

    @if (commonData.configurations().isShowMenuBar) {
    <div class="bottom-nav-container position-relative w-100 d-flex justify-content-center">
        <div class="bottom-nav-body w-100 d-flex justify-content-center align-items-center">
            @if (commonData.configurations().isShowAdd) {
            <div (click)="onClickAdd()"
                class="add-btn neo-shadow-outward position-absolute rounded-pill d-flex justify-content-center align-items-center">
                <i class="bi bi-plus"></i>
            </div>
            }

            <nav class="w-100 row g-0">
                @for(item of menuItems; track item.label) {
                <a [routerLink]="item.routerLink" routerLinkActive="active"
                    class="col nav-item d-flex flex-column align-items-center justify-content-center gap-1">
                    <i [class]="item.icon"></i>
                    <span>{{item.label}}</span>
                </a>
                }
            </nav>
        </div>
    </div>
    }
</div>
