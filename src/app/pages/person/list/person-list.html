<div class="view-container d-flex flex-column">
    <div class="d-flex justify-content-between p-3">
        <div class="fw-semibold">Sort by {{sortOptionsEnum[filterForm.get("sortValue")?.value]}}</div>
        <div (click)="showSortingModal = true">
            <i class="bi bi-filter"></i>
        </div>
    </div>
    @for (item of personsList(); track item.id) {
    <div (click)="onClickItem(item)" longPress (onLongPressEnd)="onItemLongPress(item)"
        class="list-container disable-selection">
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-pill shadow-outward-out" style="padding: 1px;">
                <img [src]="item.primaryImageUrl || '/images/no-image.png'" class="profile-image rounded-circle"
                    referrerpolicy="no-referrer" (error)="$event.target.src='/images/unsupported.png'">
            </div>
            <div class="details-container">
                <div class="name fw-semibold">{{ item.name }}</div>
                <div class="text-muted small">Age: {{ item.age }}</div>
            </div>
            <div>
                <i class="bi bi-chevron-right text-muted"></i>
            </div>
        </div>
    </div>
    } @empty {
    <div class="no-items">
        No items found!
    </div>
    }
</div>

<!-- sorting modal -->
<app-modal [isVisible]="showSortingModal" (close)="showSortingModal = false" position="bottom">
    <div [formGroup]="filterForm" class="list-actions-container">
        @for(item of sortOptionsList; track item.value) {
        <div class="list-action-item">
            <label class="flex-grow-1" for="{{item.value}}">{{item.label}}</label>
            <input formControlName="sortValue" [value]="item.value" class="form-check-input" type="radio"
                name="sortValue" id="{{item.value}}">
        </div>
        }
    </div>
</app-modal>

<!-- long press action Modal -->
<app-modal [isVisible]="showActionsModal" (close)="showActionsModal = false" position="bottom">
    <div class="list-actions-container">
        <div (click)="onClickEdit()" class="list-action-item">
            <i class="bi bi-pencil-square"></i>
            <span>Edit</span>
        </div>
        <div (click)="showDeleteConfirmationModal = true" class="list-action-item">
            <i class="bi bi-trash"></i>
            <span>Delete</span>
        </div>
        <div (click)="onClickClone()" class="list-action-item">
            <i class="bi bi-copy"></i>
            <span>Clone</span>
        </div>
    </div>
</app-modal>

<!-- delete confirmation -->
<app-modal [isVisible]="showDeleteConfirmationModal" position="center" title="Confirmation" [showClose]="true"
    [showCloseButton]="true" [showSaveButton]="true" closeButtonLabel="Cancel" saveButtonLabel="Confirm"
    (close)="showDeleteConfirmationModal=false" (save)="onClickDelete()">
    Are you sure you want to delete this item?
</app-modal>
