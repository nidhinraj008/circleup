<div class="about-container d-flex flex-column p-3 h-100">
    <div class="row justify-content-center g-0 pb-3">
        <div class="col-12 d-flex justify-content-center">
            <div class="logo-circle neo-shadow-inward d-flex flex-column align-items-center w-100 p-2">
                <i class="bi bi-people-fill"></i>
                <div class="col-12 d-flex justify-content-center fw-bold" style="font-size: 25px;">{{ appName }}</div>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center text-muted py-3">{{ description }}</div>

        <div class="col-12 d-flex justify-content-center">
            <div class="version-badge neo-shadow-curvedin">
                <i class="bi bi-tag"></i> {{ version }}
            </div>
        </div>
    </div>

    <div class="features text-center py-3">
        <div class="row g-3">
            <div class="col-4">
                <div [routerLink]="['/connections']" class="feature-card neo-shadow-outward">
                    <i class="bi bi-diagram-3"></i>
                    <p>Connections</p>
                </div>
            </div>
            <div class="col-4">
                <div [routerLink]="['/families']" class="feature-card neo-shadow-outward">
                    <i class="bi bi-people"></i>
                    <p>Families</p>
                </div>
            </div>
            <div class="col-4">
                <div class="feature-card neo-shadow-outward">
                    <i class="bi bi-cloud-arrow-up"></i>
                    <p>Backup</p>
                </div>
            </div>
        </div>
    </div>

    <div class="made-with text-center mt-auto">
        Made with <i class="bi bi-heart-fill text-danger"></i>
    </div>
</div>
