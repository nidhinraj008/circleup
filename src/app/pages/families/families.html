<div class="d-flex flex-column">
    <div class="p-3">
        <div class="family-container d-flex flex-column p-3 mb-3" [routerLink]="['/familyTree', myFamily.id]">
            <div class="fw-bold">🌳 {{myFamily.name}}</div>
            <div class="text-muted small">View your family tree</div>
        </div>
    </div>

    <div class="d-flex flex-column">
        <div class="px-3 fw-semibold">Families</div>
    
        <div class="row g-0 p-2 m-1">
            @for(item of familiesList; track item.id) {
                <div class="col-6 p-1">
                    <div class="family-container p-2 d-flex align-items-center justify-content-center" style="aspect-ratio: 2/1" [routerLink]="['/familyTree', item.id]">
                        <div class="text-center fw-semibold">{{item.name}}</div>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
