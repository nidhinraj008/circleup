<div class="d-flex flex-column">
    <div class="p-3 mb-2">
        <div class="neo-shadow-outward d-flex p-3" longPress (onLongPressEnd)="onItemLongPress(myFamily)"
            [routerLink]="['/familyTree', myFamily.id]" style="user-select: none;">
            <div class="d-flex flex-column flex-grow-1">
                <div class="fw-bold">🌳 {{myFamily.name}}</div>
                <div class="text-muted small">View your family tree</div>
            </div>
            <div class="neo-shadow-inward p-2 d-flex justify-content-center align-items-cente">
                <!-- <div class="label">Total Members</div> -->
                <i class="bi bi-person"></i>
                <div class="ps-1">{{myFamily.membersCount}}</div>
            </div>
        </div>
    </div>

    <div class="d-flex flex-column">
        <div class="px-3 fw-semibold">Families</div>
        <div class="row g-0 p-2 m-1">
            @for(item of familiesList; track item.id) {
            <div class="col-6 p-2">
                <div (click)="onClickItem(item)" longPress (onLongPressEnd)="onItemLongPress(item)"
                    class="neo-shadow-outward p-2 d-flex flex-column">
                    <div class="text-center fw-semibold">{{item.name}}</div>
                    <div class="text-center">
                        <span class="label pe-2">Members:</span>
                        <span class="value">{{item.membersCount}}</span>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</div>

<!-- long press action Modal -->
<app-modal [isVisible]="showActionsModal" (close)="showActionsModal = false" position="bottom">
    <div class="list-actions-container d-flex flex-column w-100">
        <div (click)="onClickEdit()" class="list-action-item d-flex align-items-center gap-3 py-2">
            <i class="bi bi-pencil-square"></i>
            <span>Edit</span>
        </div>
        <div (click)="showDeleteConfirmationModal = true" class="list-action-item d-flex align-items-center gap-3 py-2"
            [class.item-disabled]="selectedItem?.id == myFamily?.id">
            <i class="bi bi-trash"></i>
            <span>Delete</span>
        </div>
    </div>
</app-modal>

<!-- dete confirmation -->
<app-modal [isVisible]="showDeleteConfirmationModal" (close)="showDeleteConfirmationModal = false" position="center"
    title="Confirmation" [showClose]="true" [showCloseButton]="true" [showSaveButton]="true" closeButtonLabel="Cancel"
    saveButtonLabel="Confirm" (save)="onClickDelete()">
    Are you sure you want to delete this item?
</app-modal>
