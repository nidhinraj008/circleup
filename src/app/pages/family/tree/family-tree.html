<div class="d-flex flex-column h-100">
    <div class="d-flex justify-content-end position-relative">
        <div class="floating-container shadow-outward-out p-2 d-flex gap-2">
            <button (click)="fitGraph()" class="zoom-btn shadow-outward-out">
                <i class="bi bi-arrows-angle-expand"></i>
            </button>
            <button (click)="resetZoom()" class="zoom-btn shadow-outward-out">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <div class="y-divider"></div>
            <button (click)="onClickZoom(false)" class="zoom-btn shadow-outward-out">
                <i class="bi bi-dash"></i>
            </button>
            <div class="shadow-outward-in d-flex align-items-center justify-content-center zoom-level">
                {{ (zoomLevel() * 100) | number:'1.0-0' }}%

            </div>
            <button (click)="onClickZoom(true)" class="zoom-btn shadow-outward-out">
                <i class="bi bi-plus"></i>
            </button>
        </div>
    </div>

    <div class="flex-fill" style="width: 100vw;">
        <ngx-graph #graph [links]="personLinks" [nodes]="personNodes" layout="dagre" [layoutSettings]="layoutSettings"
            [autoCenter]="false" [draggingEnabled]="true" [panningEnabled]="true" [enableZoom]="true"
            [minZoomLevel]="minZoomLevel" [maxZoomLevel]="maxZoomLevel" [zoomLevel]="zoomLevel()"
            [zoomToFit$]="zoomToFit$" style="width: 100%; height: 100%; touch-action: none; overflow: hidden;">
            <ng-template #nodeTemplate let-node>
                @if(node.name != 'junction') {
                <svg:g>
                    <svg:foreignObject width="220" height="90">
                        <div class="w-100 h-100 position-relative" style="border-radius: var(--border-radius);">

                            <div class="d-flex gap-3 p-2 shadow-outward-out align-items-center position-absolute"
                                style="inset: 5px;" (click)="onClickPerson(node)">
                                <div class="rounded-pill shadow-outward-out"
                                    style="width: fit-content; height: fit-content; padding: 1px;">
                                    <img [src]="node.primaryImageUrl || '/images/no-image.png'"
                                        class="profile-image rounded-circle" referrerpolicy="no-referrer"
                                        (error)="$event.target.src='/images/unsupported.png'">
                                </div>
                                <div class="d-flex flex-column" style="height: fit-content;">
                                    <div class="name">{{ node.label }}</div>
                                    <div class="age">Age {{ node.age }}</div>
                                </div>
                            </div>
                        </div>
                    </svg:foreignObject>
                </svg:g>
                } @else {
                <svg:g style="filter: drop-shadow(0px 0px 1px #888)" fill="none" stroke="none">
                    <svg:foreignObject width="16" height="16">
                        <div (click)="onClickJunction(node)" style="border: 1px solid #c5c5c5"
                            class="d-flex align-items-center justify-content-center w-100 h-100 rounded-pill">
                            <i class="bi bi-dash" style="color: #555"></i>
                        </div>
                    </svg:foreignObject>
                </svg:g>
                }
            </ng-template>

            <ng-template #linkTemplate let-link>
                <svg:g class="edge">
                    <svg:path [attr.d]="link.line" stroke="#888" stroke-width="1" fill="none"
                        style="filter: drop-shadow(0px 0px 1px #888)">
                    </svg:path>
                </svg:g>
            </ng-template>
        </ngx-graph>
    </div>
</div>
