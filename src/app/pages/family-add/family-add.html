<div class="p-3" style="position: relative; padding-bottom: 105px !important;">
    <form [formGroup]="familyForm" (ngSubmit)="onClickSubmit()">
        <div class="neo-formcontrol" [class.filled]="familyFormControls['name']?.value"
                [class.invalid]="familyFormControls['name'].touched && familyFormControls['name'].invalid">
            <input type="text" formControlName="name" autocomplete="off"/>
            <label>Name</label>
        </div>

        <div class="neo-formcontrol mb-5" [class.filled]="familyFormControls['members']?.value?.length">
            <ng-select formControlName="members" bindLabel="name" bindValue="id"
                [multiple]="true" [closeOnSelect]="false">
                @for (item of (personsList$ | async); track item.id) {
                <ng-option [value]="item.id">{{item.name}}</ng-option>
                }
            </ng-select>
            <label>Family Members</label>
        </div>
    </form>
</div>
