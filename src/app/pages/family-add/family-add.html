<div class="p-3" style="position: relative; padding-bottom: 105px !important;">
    <form [formGroup]="familyForm" (ngSubmit)="onClickSubmit()">

        <div class="basic-control-container form-floating">
            <input formControlName="name" type="text" class="form-control" placeholder="Name"
                [class.is-invalid]="familyFormControls['name'].touched && familyFormControls['name'].invalid">
            <label class="primary-label">
                Name
            </label>
        </div>

        <div class="basic-control-container form-floating">
            <ng-select class="form-select form-ng-select" formControlName="familyId" bindLabel="name" bindValue="id"
                [multiple]="true" placeholder="Select Members" formControlName="members" [closeOnSelect]="false">
                @for (item of (personsList$ | async); track item.id) {
                <ng-option [value]="item.id">{{item.name}}</ng-option>
                }
            </ng-select>
            <label class="primary-label" for="father">
                Family Members
            </label>
        </div>
    </form>
</div>
