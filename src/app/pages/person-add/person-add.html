<div class="p-3" style="position: relative; padding-bottom: 105px !important;">
    <form [formGroup]="detailsForm" (ngSubmit)="onClickSubmit()">
        <div class="text-center pb-2">
            <div (click)="showImageActionModal = true"
                class="position-relative d-inline-block rounded-pill shadow-outward-out" style="padding: 1px;">
                <img [src]="profileImageUrl() ?? 'images/no-image.png'"
                    class="profile-image rounded-circle" referrerpolicy="no-referrer"
                    (error)="$event.target.src='images/unsupported.png'">
            </div>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['name']?.value"
            [class.invalid]="detailsFormControlls['name'].touched && detailsFormControlls['name'].invalid">
            <input formControlName="name" type="text" autocomplete="off" />
            <label>Name</label>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['gender']?.value">
            <ng-select formControlName="gender" [items]="genderOptions" bindLabel="label" bindValue="value"
                [class.is-invalid]="detailsFormControlls['gender'].touched && detailsFormControlls['gender'].invalid">
            </ng-select>
            <label>Gender</label>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['dateOfBirth']?.value"
            [class.invalid]="detailsFormControlls['dateOfBirth'].touched && detailsFormControlls['dateOfBirth'].invalid">
            <input formControlName="dateOfBirth" type="date" [max]="currentDate | date:'yyyy-MM-dd'" />
            <label>Date of Birth</label>
        </div>

        <div class="d-flex gap-2">
            <div class="neo-formcontrol w-100" [class.filled]="detailsFormControlls['ageYears']?.value >= 0">
                <input formControlName="ageYears" type="text" readonly />
                <label>Years</label>
            </div>
            <div class="neo-formcontrol w-100" [class.filled]="detailsFormControlls['ageMonths']?.value >= 0">
                <input formControlName="ageMonths" type="text" readonly />
                <label>Months</label>
            </div>
            <div class="neo-formcontrol w-100" [class.filled]="detailsFormControlls['ageDays']?.value >= 0">
                <input formControlName="ageDays" type="text" readonly />
                <label>Days</label>
            </div>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['home']?.value">
            <input formControlName="home" type="text" autocomplete="off" />
            <label>Home</label>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['fatherId']?.value">
            <ng-select formControlName="fatherId" bindLabel="label" bindValue="value">
                @for (item of malePersons(); track item.id) {
                <ng-option [value]="item.id">{{item.name}}</ng-option>
                }
            </ng-select>
            <label>Father</label>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['motherId']?.value">
            <ng-select formControlName="motherId" bindLabel="label" bindValue="value">
                @for (item of femalePersons(); track item.id) {
                <ng-option [value]="item.id">{{item.name}}</ng-option>
                }
            </ng-select>
            <label>Mother</label>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['status']?.value">
            <ng-select formControlName="status" [items]="statusOptions" bindLabel="label" bindValue="value"
                [clearable]="false" [clearOnBackspace]="false">
            </ng-select>
            <label>Status</label>
        </div>

        @if(detailsForm.get("status")?.value == statusEnum.Deceased) {
        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['deathDate']?.value">
            <input formControlName="deathDate" type="date" />
            <label>Date of Death</label>
        </div>

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['deathCause']?.value">
            <input formControlName="deathCause" type="text" autocomplete="off" />
            <label>Death Cause</label>
        </div>
        }

        <div class="neo-formcontrol" [class.filled]="detailsFormControlls['notes']?.value">
            <textarea formControlName="notes" style="height: 100px"></textarea>
            <label>Notes</label>
        </div>
    </form>
</div>

<!-- long press action Modal -->
<app-modal [isVisible]="showImageActionModal" (close)="showImageActionModal = false" position="bottom">
    <div class="list-actions-container d-flex flex-column w-100">
        <div (click)="fileInput.click()" class="list-action-item d-flex align-items-center gap-3 py-2">
            <i class="bi bi-upload"></i>
            <span>Upload</span>
            <input id="fileUploader" type="file" (change)="onFileChange($event)" hidden #fileInput>
        </div>

        <div (click)="showImageLoadModal = true" class="list-action-item d-flex align-items-center gap-3 py-2">
            <i class="bi bi-link-45deg"></i>
            <span>Link</span>
        </div>

        <div (click)="profileImageUrl() && showImageDeleteConfirmationModal = true"
            [class.item-disabled]="!profileImageUrl()"
            class="list-action-item d-flex align-items-center gap-3 py-2">
            <i class="bi bi-trash"></i>
            <span>Delete</span>
        </div>
    </div>
</app-modal>

<!-- image linking Modal -->
<app-modal [isVisible]="showImageLoadModal" position="center" title="Image link" [showClose]="true"
    [showProcessButton]="true" [showSaveButton]="true" processButtonLabel="Load" saveButtonLabel="Save"
    (close)="showImageLoadModal=false" (process)="onClickLoadImage()" (save)="onClickSaveLink()">
    @if(isImageLinkValid()) {
    <div class="d-flex w-100 justify-content-center pb-2">
        <div class="position-relative d-inline-block">
            <img [src]="imageLink() ?? 'images/no-image.png'" class="preview-image border" referrerpolicy="no-referrer"
                (error)="$event.target.src='images/unsupported.png'">
        </div>
    </div>
    }
    <div class="neo-formcontrol" [class.filled]="imageLink()" [class.invalid]="!isImageLinkValid() && imageLink()">
        <input [ngModel]="imageLink()" (ngModelChange)="imageLink.set($event)" type="text" autocomplete="off" />
        <label>Image link</label>
    </div>
</app-modal>

<!-- delete confirmation -->
<app-modal [isVisible]="showImageDeleteConfirmationModal" position="center" title="Confirmation" [showClose]="true"
    [showCloseButton]="true" [showSaveButton]="true" closeButtonLabel="Cancel" saveButtonLabel="Confirm"
    (close)="showImageDeleteConfirmationModal=false" (save)="removeImage()">
    Are you sure you want to delete this image?
</app-modal>
