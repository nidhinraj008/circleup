<div class="view-container d-flex flex-column gap-3 py-3">
    <div class="px-3">
        <div class="shadow-outward-out p-3">
            <h6 class="section-title mb-3">Default Playback Speed</h6>
            <div class="d-flex gap-2">
                @for (s of [0.5, 1, 1.5, 2]; track s) {
                <button (click)="ttsService.setSpeed(s)" class="player-btn shadow-outward-out flex-1 py-2 fw-bold"
                    [class.active-speed]="ttsService.speed() === s">
                    {{s}}x
                </button>
                }
            </div>
        </div>
    </div>


    <div class="d-flex flex-column gap-2">
        <div class="px-3">
            <h6 class="section-title m-0 mt-1">Available Voices</h6>
        </div>

        <div class="d-flex flex-column">
            @for (voice of availableVoices(); track voice.name) {
            <div (click)="selectVoice(voice)" class="list-container disable-selection disable-selection"
                [class.selected-voice]="ttsService.selectedVoiceName() === voice.name">
                <div class="d-flex align-items-center gap-3">
                    <div class="voice-icon-container shadow-outward-out">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="details-container">
                        <div class="name fw-semibold">{{ voice.name }}</div>
                        <div class="text-muted small">Age: {{ voice.lang }}</div>
                    </div>
                    <div (click)="previewVoice($event, voice)" class="preview-btn shadow-outward-out">
                        <i class="bi" [class.bi-play-fill]="isPreviewPlaying() !== voice.name"
                            [class.bi-stop-fill]="isPreviewPlaying() === voice.name"></i>
                    </div>
                </div>
            </div>
            } @empty {
            <div class="no-items text-center py-5">
                <i class="bi bi-play-fill display-1 text-muted opacity-25"></i>
                <p class="text-muted mt-3">No voices found.</p>
            </div>
            }
        </div>
    </div>

</div>
