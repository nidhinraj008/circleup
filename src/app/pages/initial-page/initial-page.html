<div class="d-flex" style="height: 100vh;">
    <div class="w-100 p-3">
        <form [formGroup]="initialForm" (ngSubmit)="onClickSubmit()" class="d-flex flex-column h-100">
            <div class="d-flex flex-column py-4 my-2">
                <h2 class="m-0 fw-bold">Let's get started</h2>
                <div class="m-0 fw-light" style="font-size: 14px;">Tell us a little about yourself</div>
            </div>
            <div class="d-flex flex-column gap-2">
                <div class="neo-formcontrol" [class.filled]="initialFormControlls['name']?.value"
                    [class.invalid]="initialFormControlls['name'].touched && initialFormControlls['name'].invalid">
                    <input formControlName="name" type="text" autocomplete="off" />
                    <label>Name</label>
                </div>

                <div class="neo-formcontrol" [class.filled]="initialFormControlls['gender']?.value"
                    [class.invalid]="initialFormControlls['gender'].touched && initialFormControlls['gender'].invalid">
                    <ng-select formControlName="gender" [items]="genderOptions" bindLabel="label" bindValue="value">
                    </ng-select>
                    <label>Gender</label>
                </div>

                <div class="neo-formcontrol" [class.filled]="initialFormControlls['dateOfBirth']?.value"
                    [class.invalid]="initialFormControlls['dateOfBirth'].touched && initialFormControlls['dateOfBirth'].invalid">
                    <input formControlName="dateOfBirth" type="date" [max]="currentDate | date:'yyyy-MM-dd'" />
                    <label>Date of Birth</label>
                </div>
            </div>

            <div class="mt-auto mb-3">
                <button class="primary-button" type="submit">
                    Continue <i class="bi bi-arrow-right fw-bold ms-2"></i>
                </button>
            </div>
        </form>
    </div>
</div>
