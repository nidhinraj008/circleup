<div class="row g-0 p-2">
    <div class="col-6 p-2">
        <div class="shadow-outward-out p-3 d-flex flex-column justify-content-center gap-2">
            <div class="shadow-outward-in p-2 d-flex justify-content-center align-items-center">
                <h1 class="m-0">11:11</h1>
            </div>

            <div class="d-flex justify-content-center">
                <span>28/04/2026</span>
            </div>

            <div class="d-flex justify-content-end align-items-center">
                <div class="pe-3" style="font-size: 20px;">
                    <i class="bi bi-battery-charging m-0"></i>
                </div>
                <div>
                    charge 88%
                </div>
            </div>
        </div>
    </div>

    <div class="col-6 px-2">
        <div class="py-2">
            <div class="shadow-outward-out p-2">
                <h6>Today</h6>
                <div class="d-flex gap-2">
                    <div class="d-flex align-items-center gap-1">
                        <span class="pill">11</span>
                        <span class="pill-label">H</span>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <span class="pill">11</span>
                        <span class="pill-label">M</span>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <span class="pill">11</span>
                        <span class="pill-label">S</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="py-2">
            <div class="shadow-outward-out p-2 d-flex align-items-center gap-2">
                <div class="progress-circle" [style.background]="'conic-gradient(#e0b56d ' + progress + '%, #555 0%)'">
                    <div class="progress-content">
                        {{progress}}%
                    </div>
                </div>
                <div class="d-flex flex-column align-items-center flex-grow-1" style="font-size: 15px;">
                    <div style="font-size: 15px;">
                        This year
                    </div>
                    <div style="color: #555">
                        {{remainingDays}} d
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-6 row g-0 px-2">
        <div class="col-12 row g-0 d-flex py-2">
            <div class="col-6 pe-2">
                <div class="shadow-outward-out neo-icon d-flex justify-content-center align-items-center">
                    <i class="bi bi-twitter-x"></i>
                </div>
            </div>
            <div class="col-6 ps-2">
                <div class="shadow-outward-out neo-icon d-flex justify-content-center align-items-center">
                    <i class="bi bi-browser-chrome"></i>
                </div>
            </div>
        </div>

        <div class="col-12 py-2">
            <div class="neo-toggle shadow-outward-out">
                <div class="toggle-circle shadow-outward-outs">
                    <i class="bi bi-moon-stars-fill"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-6 p-2">
        <div class="shadow-outward-out p-3 d-flex flex-column justify-content-center gap-2">
            <div class="shadow-outward-in p-2 d-flex justify-content-around align-items-center">
                <div (click)="drinkWater(0)" class="neo-icon">
                    <i class="bi bi-dash"></i>
                </div>
                <div class="neo-icon">
                    <i class="bi bi-measuring-cup"></i>
                </div>
                <div (click)="drinkWater(1)" class="neo-icon">
                    <i class="bi bi-plus"></i>
                </div>
            </div>

            <div class="d-flex justify-content-center">
                {{dringCount}}/8
            </div>

            <div class="d-flex justify-content-end align-items-center">
                <small>Daily drinking water</small>
            </div>
        </div>
    </div>
</div>
